<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyosBayan - Ticket Details</title>
    <style>
        /* 1. Create the animation rule */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 2. Apply it to your main boxes */
        .container, .main-content {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        body {
            background-color: #1a1a1a; 
            color: #f5f5dc; 
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            padding-top: 60px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f5f5dc; 
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid transparent;
        }

        .back-btn:hover {
            border: 1px solid #4CAF50;
            background-color: rgba(76, 175, 80, 0.1); 
        }

        .container {
            background-color: #262626;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 128, 0, 0.2);
            width: 100%; 
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 {
            color: #4CAF50;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background-color: #ff9999; 
            color: #1a1a1a; /* Clean dark text */
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        .evidence-photo {
            width: 100%;
            height: 200px;
            background-color: #1a1a1a;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            margin: 15px 0;
            object-fit: cover; 
            cursor: pointer; 
            transition: 0.3s;
        }

        .evidence-photo:hover {
            opacity: 0.8; 
        }

        .details-section {
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #555;
            margin-bottom: 25px;
        }

        .details-section p {
            margin: 5px 0;
            font-size: 14px;
        }

        .label {
            color: #4CAF50;
            font-weight: bold;
        }

        h3 {
            color: #f5f5dc;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .timeline {
            border-left: 2px solid #4CAF50; 
            margin-left: 10px;
            padding-left: 20px;
            margin-bottom: 20px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
        }

        .timeline-dot {
            position: absolute;
            left: -27px; 
            top: 2px;
            background-color: #4CAF50;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .timeline-date {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .timeline-action {
            font-size: 14px;
            color: #f5f5dc;
            font-weight: bold;
        }

        /* --- NEW: ADMIN CONTROLS CSS --- */
        .admin-controls {
            background-color: #2a3d2a; /* Gives it a subtle green tint so it stands out */
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #4CAF50;
            margin-top: 20px;
        }

        .admin-controls h3 {
            margin-top: 0;
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 15px;
            color: #4CAF50;
        }

        .status-dropdown {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            color: #f5f5dc;
            border: 1px solid #555;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .btn-update {
            background-color: #4CAF50;
            color: #1a1a1a;
            border: none;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-update:hover {
            background-color: #45a049;
        }

        /* --- FULL SCREEN MODAL CSS --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.9); 
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            max-width: 95%;
            max-height: 85%;
            border-radius: 8px;
            border: 2px solid #4CAF50;
            object-fit: contain; 
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #f5f5dc;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

    <a href="/board" class="back-btn" id="dynamic-back-btn">&#8592; Back</a>

    <div class="container">
        <h2>
            #{{ ticket.id }}
            <span class="status-badge">{{ ticket.status }}</span>
        </h2>
        
        <img src="https://dummyimage.com/400x300/262626/4caf50&text=Tap+to+View+Full+Screen" alt="Evidence" class="evidence-photo" id="ticket-img">

        <div class="details-section">
            <p><span class="label">Issue:</span> {{ ticket.type }}</p>
            <p><span class="label">Location:</span> {{ ticket.street }}</p>
            <p><span class="label">Notes:</span> {{ ticket.description }}</p>
        </div>

        <h3>Ledger History</h3>
        
        <div class="timeline">
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-date">{{ ticket.date }} - 10:45 AM</div>
                <div class="timeline-action">Report Submitted by Resident</div>
            </div>
        </div>

        <div class="admin-controls">
            <h3>Admin Actions</h3>
            <form action="/ticket/{{ ticket.id }}/update" method="POST">
                
                <select name="status" class="status-dropdown" required>
                    <option value="Open" {% if ticket.status == 'Open' %}selected{% endif %}>Open</option>
                    <option value="In Progress" {% if ticket.status == 'In Progress' %}selected{% endif %}>In Progress (Fixing Now)</option>
                    <option value="Resolved" {% if ticket.status == 'Resolved' %}selected{% endif %}>Resolved (Fixed)</option>
                </select>
                
                <button type="submit" class="btn-update">Save Changes</button>
            </form>
        </div>

    </div>

    <div id="imageModal" class="modal">
        <span class="close-btn" id="closeModal">&times;</span>
        <img class="modal-content" id="fullScreenImg">
    </div>

    <script>
        const modal = document.getElementById("imageModal");
        const fullScreenImg = document.getElementById("fullScreenImg");
        const ticketImg = document.getElementById("ticket-img");
        const closeModal = document.getElementById("closeModal");

        ticketImg.addEventListener('click', function() {
            modal.style.display = "flex"; 
            fullScreenImg.src = this.src; 
        });

        closeModal.addEventListener('click', function() {
            modal.style.display = "none";
        });

        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        });

        // Clever trick: If they came from the admin dashboard, make the back button go to the dashboard instead of the public board!
        if(document.referrer.includes('/admin/dashboard')) {
            document.getElementById('dynamic-back-btn').href = '/admin/dashboard';
        }
    </script>

</body>
</html>
