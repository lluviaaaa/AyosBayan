<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyosBayan - Citizen Home</title>
    <style>
        
        /* 1. Create the animation rule */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 2. Apply it to your main boxes */
        .container, .main-content {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        body {
            background-color: #1a1a1a; 
            color: #f5f5dc; 
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            height: 100vh; 
            margin: 0;
            text-align: center;
            position: relative; /* This allows us to position the back button freely */
        }

        /* NEW: Styling for the Back Button */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f5f5dc; /* Beige to match the theme */
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid transparent;
        }

        /* Adds a subtle green outline when you hover over it */
        .back-btn:hover {
            border: 1px solid #4CAF50;
            background-color: rgba(76, 175, 80, 0.1); 
        }

        .container {
            background-color: #262626;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 128, 0, 0.2);
            width: 300px; 
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 5px;
        }

        p {
            margin-bottom: 30px;
            font-size: 16px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 180px;
            padding: 15px 20px;
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box; 
        }

        .btn-report {
            background-color: #4CAF50; 
            color: #f5f5dc; 
            border: none;
        }

        .btn-board {
            background-color: #f5f5dc; 
            color: #1a1a1a; 
            border: 2px solid #4CAF50; 
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888; 
        }
    </style>
</head>
<body>

    <a href="/" class="back-btn">&#8592; Back</a>

    <div class="container">
        <h1>AyosBayan</h1>
        <p>Help keep our barangay safe and clean.</p>
        
        <div class="button-group">
            <a href="/report/step1" class="btn btn-report">Report an Issue</a>
            <a href="/board" class="btn btn-board">View Public Board</a>
        </div>
    </div>

    <div class="footer">
        Barangay San Isidro | Contact: (02) 1234-5678
    </div>

</body>
</html>
