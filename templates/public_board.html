<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyosBayan - Public Board</title>
    <style>
        /* 1. Create the animation rule */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 2. Apply it to your main boxes */
        .container, .main-content {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        body {
            background-color: #1a1a1a; 
            color: #f5f5dc; 
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            padding-top: 60px; /* Space for the back button */
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f5f5dc; 
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid transparent;
        }

        .back-btn:hover {
            border: 1px solid #4CAF50;
            background-color: rgba(76, 175, 80, 0.1); 
        }

        /* Container that holds everything and keeps it from getting too wide on PCs */
        .board-container {
            max-width: 500px;
            margin: 0 auto; 
        }

        h2 {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Search Bar */
        .search-bar {
            width: 100%;
            padding: 12px;
            background-color: #262626;
            color: #f5f5dc;
            border: 1px solid #555;
            border-radius: 5px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .search-bar:focus {
            border-color: #4CAF50;
            outline: none;
        }

        /* Filter Tabs */
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto; /* Lets you swipe through tabs if on a small phone */
            padding-bottom: 5px;
        }

        .filter-btn {
            background-color: #262626;
            color: #f5f5dc;
            border: 1px solid #555;
            padding: 8px 15px;
            border-radius: 20px; /* Makes them look like pills */
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn.active {
            background-color: #4CAF50;
            color: #1a1a1a;
            border-color: #4CAF50;
            font-weight: bold;
        }

        /* Issue Cards */
        .card {
            background-color: #f5f5dc; /* Beige card */
            border: 2px solid #4CAF50; /* Green border */
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex; /* Lines up image and text side-by-side */
            gap: 15px;
            color: #1a1a1a; /* Dark text for readability on beige */
            text-decoration: none; /* If we make the whole card clickable later */
        }

        .card-img-placeholder {
            width: 60px;
            height: 60px;
            background-color: #ccc;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .card-content {
            flex-grow: 1;
        }

        .card-title {
            font-weight: bold;
            font-size: 16px;
            margin: 0 0 5px 0;
        }

        .card-street {
            font-size: 14px;
            color: #555;
            margin: 0 0 10px 0;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
        }

        /* Status Badges */
        .status-badge {
            padding: 4px 8px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 11px;
            color: #1a1a1a; /* New black font */
        }

        .status-open { background-color: #ff9999; } /* Softer, highly readable red */
        .status-progress { background-color: #ff9800; } /* Orange */
        .status-resolved { background-color: #4CAF50; } /* Green */
    </style>
</head>
<body>

    <a href="#" onclick="history.back(); return false;" class="back-btn">&#8592; Back</a>

    <div class="board-container">
        <h2>Public Board</h2>

        <input type="text" id="search-input" placeholder="tree">

            <div class="filter-group">
                <button class="filter-btn active" data-filter="All">All</button>
                <button class="filter-btn" data-filter="Open">Open</button>
                <button class="filter-btn" data-filter="In Progress">Fixing Now</button> 
                <button class="filter-btn" data-filter="Resolved">Resolved</button>
            </div>

        <div id="ledger-list">
            {% for report in reports %}
                <div class="board-item" data-status="{{ report.status }}" style="background-color: #262626; padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #4CAF50;">
                    <h4 class="ticket-text" style="margin: 0; color: #f5f5dc;">{{ report.issue_type }} - {{ report.id }}</h4>
                    <p class="ticket-text" style="margin: 5px 0; color: #a3a3a3; font-size: 14px;">📍 {{ report.street }}</p>
                    <p class="ticket-text" style="margin: 5px 0; color: #d1d1d1; font-size: 14px;">{{ report.description }}</p>
                    <span style="background-color: #333; color: #4CAF50; padding: 3px 8px; border-radius: 3px; font-size: 12px; font-weight: bold;">{{ report.status }}</span>
                    <span style="color: #888; font-size: 12px; margin-left: 10px;">Reported: {{ report.date_reported }}</span>
                </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function filterReports(status) {
            // Update active button color
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Hide/Show cards based on status
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (status === 'All' || card.getAttribute('data-status') === status) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Live Search Bar
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const query = this.value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            
            cards.forEach(card => {
                const text = card.getAttribute('data-text').toLowerCase();
                if (text.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('search-input');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const tickets = document.querySelectorAll('.board-item');

        let currentSearch = '';
        let currentFilter = 'All';

        // The main filtering function
        function filterTickets() {
            tickets.forEach(ticket => {
                // Grab all the text inside the ticket (title, description, street)
                const textContent = ticket.innerText.toLowerCase();
                const status = ticket.getAttribute('data-status');

                // Check if it matches our rules
                const matchesSearch = textContent.includes(currentSearch);
                const matchesFilter = (currentFilter === 'All') || (status === currentFilter);

                // Show or hide instantly!
                if (matchesSearch && matchesFilter) {
                    ticket.style.display = 'block'; 
                } else {
                    ticket.style.display = 'none';
                }
            });
        }

        // 1. Listen for typing in the search bar
        if(searchInput) {
            searchInput.addEventListener('input', function(e) {
                currentSearch = e.target.value.toLowerCase();
                filterTickets();
            });
        }

        // 2. Listen for clicks on the filter buttons
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove the green highlight from all buttons
                filterBtns.forEach(b => {
                    b.classList.remove('active');
                    b.style.backgroundColor = 'transparent'; // Reset to dark
                });
                
                // Add the green highlight to the clicked button
                this.classList.add('active');
                this.style.backgroundColor = '#00c853'; // Make it green!
                
                currentFilter = this.getAttribute('data-filter');
                filterTickets();
            });
        });
    });
</script>

</body>
</html>
