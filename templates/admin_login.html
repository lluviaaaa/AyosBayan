<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyosBayan - Admin Login</title>
    <style>
        /* 1. Create the animation rule */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 2. Apply it to your main boxes */
        .container, .main-content {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        body {
            background-color: #1a1a1a; 
            color: #f5f5dc; 
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 50% -20%, #2a3d2a, #1a1a1a); /* Adds a subtle green glow at the top */
        }

        .login-card {
            background-color: #262626;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 320px;
            text-align: center;
            border-top: 4px solid #4CAF50; /* Green accent line */
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            margin: 0 0 5px 0;
            color: #f5f5dc;
        }

        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #4CAF50;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            color: #f5f5dc;
            border: 1px solid #555;
            border-radius: 5px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        .btn-login {
            background-color: #4CAF50;
            color: #1a1a1a;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
        }

        .btn-login:hover {
            background-color: #45a049;
        }

        .back-link {
            color: #888;
            text-decoration: none;
            font-size: 12px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #f5f5dc;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon">&#128274;</div> <h2>Admin Portal</h2>
        <p>Authorized Personnel Only</p>

        <form action="/admin/dashboard" method="GET">
            
            <div class="input-group">
                <label>USERNAME</label>
                <input type="text" class="input-field" placeholder="Enter admin ID" required>
            </div>

            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" class="input-field" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn-login">Secure Login</button>
        </form>

        <a href="/" class="back-link">&#8592; Return to Homepage</a>
    </div>

</body>
</html>
