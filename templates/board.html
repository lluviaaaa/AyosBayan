<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyosBayan - Public Board</title>
    <style>
        body {
            background-color: #1a1c1e; 
            color: #f5f5dc; 
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .back-btn {
            display: inline-block;
            color: #f5f5dc; 
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid transparent;
        }

        .back-btn:hover {
            border: 1px solid #4CAF50;
            background-color: rgba(76, 175, 80, 0.1); 
        }

        .board-container {
            max-width: 600px;
            margin: 0 auto; 
            animation: fadeInUp 0.5s ease-out;
        }

        h2 {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 20px;
        }

        /* --- SEARCH & FILTERS --- */
        #search-input {
            width: 100%;
            padding: 12px;
            background-color: #222528;
            color: #f5f5dc;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto; 
            padding-bottom: 5px;
        }

        .filter-btn {
            background-color: #222528;
            color: #a3a3a3;
            border: 1px solid #2d3d2d;
            padding: 8px 15px;
            border-radius: 20px; 
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn.active {
            background-color: #4CAF50;
            color: #121212;
            border-color: #4CAF50;
            font-weight: bold;
        }

        /* --- TICKET CARDS --- */
        .board-item {
            background-color: #222528;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <a href="/citizen" class="back-btn">&#8592; Back to Home</a>

    <div class="board-container">
        <h2>Public Active Ledger</h2>

        <input type="text" id="search-input" placeholder="Search reports...">

        <div class="filter-group">
            <button class="filter-btn active" data-filter="All">All</button>
            <button class="filter-btn" data-filter="Open">Open</button>
            <button class="filter-btn" data-filter="In Progress">Fixing Now</button> 
            <button class="filter-btn" data-filter="Resolved">Resolved</button>
        </div>

        <div id="ledger-list">
            {% for report in reports %}
                <div class="board-item" data-status="{{ report.status }}">
                    <h4 style="margin: 0 0 5px 0; color: #e6c883;">{{ report.issue_type }} - {{ report.id }}</h4>
                    <p style="margin: 0 0 10px 0; color: #a3a3a3; font-size: 14px;">📍 {{ report.street }}</p>
                    <p style="margin: 0 0 15px 0; color: #d1d1d1; font-size: 14px;">{{ report.description }}</p>
                    
                    <span style="background-color: #162b1b; color: #4CAF50; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid #4CAF50;">{{ report.status }}</span>
                    <span style="color: #888; font-size: 12px; margin-left: 10px;">{{ report.date_reported }}</span>
                </div>
            {% else %}
                <p style="text-align: center; color: #888;">No active reports in the ledger right now.</p>
            {% endfor %}
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const tickets = document.querySelectorAll('.board-item');
            let currentSearch = '';
            let currentFilter = 'All';

            function filterTickets() {
                tickets.forEach(ticket => {
                    const textContent = ticket.innerText.toLowerCase();
                    const status = ticket.getAttribute('data-status');
                    const matchesSearch = textContent.includes(currentSearch);
                    const matchesFilter = (currentFilter === 'All') || (status === currentFilter);

                    ticket.style.display = (matchesSearch && matchesFilter) ? 'block' : 'none';
                });
            }

            if(searchInput) {
                searchInput.addEventListener('input', e => {
                    currentSearch = e.target.value.toLowerCase();
                    filterTickets();
                });
            }

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => {
                        b.classList.remove('active');
                        b.style.backgroundColor = '#222528'; 
                        b.style.color = '#a3a3a3';
                    });
                    this.classList.add('active');
                    this.style.backgroundColor = '#4CAF50'; 
                    this.style.color = '#121212';
                    currentFilter = this.getAttribute('data-filter');
                    filterTickets();
                });
            });
        });
    </script>
</body>
</html>
